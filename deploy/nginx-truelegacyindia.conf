# Nginx config for https://truelegacyindia.com — static prerendered SPA
#
# Apply on the server (merge into the existing server_name truelegacyindia.com block),
# then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify:
#   curl -sI https://truelegacyindia.com/ | grep -iE 'cache-control|strict-transport|x-content-type|x-frame|content-security|referrer-policy|permissions-policy'
#
# Context: `npm run build` writes prerendered HTML per route into dist/
# (scripts/generate-static-seo.mjs). CI copies dist/ to
# /var/www/html/truelegacy-dev-new — it does NOT update nginx site config.
#
# CRITICAL: `try_files $uri /index.html` alone does NOT serve
# dist/contact/index.html for /contact. Use `$uri/index.html` as below.
#
# NOTE: nginx clears parent `add_header` when a location sets its own.
# Security headers are therefore repeated in every location that uses add_header.
# Prefer: include nginx-security-headers.inc;  (adjust absolute path on the VPS)

# ---------------------------------------------------------------------------
# 1) WWW → non-WWW (own server block if not already present)
# ---------------------------------------------------------------------------
# server {
#     listen 80;
#     listen 443 ssl http2;
#     server_name www.truelegacyindia.com;
#     # ssl_certificate / ssl_certificate_key ...
#     return 301 https://truelegacyindia.com$request_uri;
# }

# ---------------------------------------------------------------------------
# 2) Inside server { server_name truelegacyindia.com; ... }
# ---------------------------------------------------------------------------

# --- Sensitive-path hardening (MUST be above `location /`) ---
# The SPA catch-all returns HTTP 200 + homepage HTML for missing paths like
# /.env — scanners flag that as "exposed secrets". Hard-404 those probes.

location ^~ /.well-known/ {
    allow all;
    default_type "text/plain";
    try_files $uri =404;
}

location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~* ^/(?:phpinfo|info|test|wp-config|xmlrpc|wp-login)\.php$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

location ~* \.(?:env|sql|bak|htpasswd|log|ini)$ {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Vite hashed assets (/assets/*.[hash].js|css|mp4|webp|…) — safe to cache forever
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # include /etc/nginx/snippets/truelegacy-security-headers.inc;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://wa.me; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.truelegacy.in https://crm.truelegacy.in https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://connect.facebook.net https://www.facebook.com https://*.facebook.com https://*.google-analytics.com https://*.analytics.google.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.facebook.com; media-src 'self' https: blob:; upgrade-insecure-requests" always;
    access_log off;
    try_files $uri =404;
}

# Root public/ media (whatsapp.webp, hero webp, accent icons, fonts, etc.)
location ~* \.(?:webp|png|jpe?g|gif|svg|ico|mp4|webm|woff2?|otf|ttf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://wa.me; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.truelegacy.in https://crm.truelegacy.in https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://connect.facebook.net https://www.facebook.com https://*.facebook.com https://*.google-analytics.com https://*.analytics.google.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.facebook.com; media-src 'self' https: blob:; upgrade-insecure-requests" always;
    access_log off;
    try_files $uri =404;
}

location = /robots.txt {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    try_files $uri =404;
}

location = /sitemap.xml {
    add_header Cache-Control "no-cache" always;
    add_header Content-Type "application/xml" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    try_files $uri =404;
}

# HTML always revalidates so new deploys are seen promptly
# Prefer $uri/index.html so /contact serves dist/contact/index.html with 200
# (avoid nginx's directory 301 /contact → /contact/, which SEO tools flag as broken links).
location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://wa.me; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.truelegacy.in https://crm.truelegacy.in https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://connect.facebook.net https://www.facebook.com https://*.facebook.com https://*.google-analytics.com https://*.analytics.google.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.facebook.com; media-src 'self' https: blob:; upgrade-insecure-requests" always;
    try_files $uri $uri/index.html $uri/ /index.html;
}
