# Cache headers only — see deploy/nginx-truelegacyindia.conf for the full
# recommended server snippet (try_files + caching + sitemap).
#
# Merge these location blocks into the truelegacyindia.com server { }, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify:
#   curl -sI https://truelegacyindia.com/assets/index-xxxxx.js | grep -i cache-control
#   # Expect: Cache-Control: public, max-age=31536000, immutable
#   curl -sI https://truelegacyindia.com/whatsapp.png | grep -i cache-control

# Vite hashed assets — long-lived, immutable
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
}

# Other static media in site root (public/)
location ~* \.(?:webp|png|jpe?g|gif|svg|ico|mp4|webm|woff2?|otf|ttf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
}

# HTML must always revalidate so new deploys are seen
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
